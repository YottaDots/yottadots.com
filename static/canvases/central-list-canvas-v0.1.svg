<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1684 1191" width="1684" height="1191" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The Central List Canvas</title>
<desc id="d">The YottaDots Central List Canvas, a worksheet for pattern 1, Name what is central. Section 1, What the centre decides: a table with the columns decision, why central, owner and review date, with rows for mission and vision, strategy, ranked goals, agreed guardrails, capacity and money, and other decisions that need a reason. Section 2, Stays with the value streams: examples such as method, planning, team set-up, tools, roles and priorities within the goals, plus space for more. Section 3, Grey zone: decisions where it is unclear who decides; until the list changes, the value stream decides. Section 4, How this list changes: additions are announced with a reason, value streams can object or propose, with fields for the owner of the list, where it is published and the next review date. Section 5, Check: fits on one page, names decisions not departments, no catch-all item, public to everyone, includes the default rule.</desc>
