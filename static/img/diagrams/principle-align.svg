<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Principle 2: Align</title>
<desc id="d">Three situations side by side. Left: autonomy without alignment. Value streams move in different directions, which leads to fragmentation. Middle: alignment without a voice. Goals are pushed down and nobody believes them. Right: Align. Shared goals that the value streams helped shape, so everyone moves in one direction, each in its own way. Below: shared direction, local choice.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">PRINCIPLE 2</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Align</text>
<rect x="40" y="130" width="360" height="420" rx="14" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="68" y="172" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start" >Freedom, no alignment</text>
<text x="68" y="200" font-size="15" fill="#9b9b9b" font-weight="600" text-anchor="start" >→ fragmentation</text>
<rect x="420" y="130" width="360" height="420" rx="14" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="448" y="172" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start" >Alignment, no voice</text>
<text x="448" y="200" font-size="15" fill="#9b9b9b" font-weight="600" text-anchor="start" >→ goals nobody believes</text>
<rect x="800" y="130" width="360" height="420" rx="14" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="828" y="172" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start" >Align</text>
<text x="828" y="200" font-size="15" fill="#f28c28" font-weight="600" text-anchor="start" >→ one direction, many ways</text>
