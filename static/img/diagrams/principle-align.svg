<line x1="1122" y1="440" x2="1152" y2="410" stroke="#f28c28" stroke-width="2.5" marker-end="url(#arrO)"/>
<text x="980" y="500" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="middle" >goals down · objections up</text>
<text x="980" y="522" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="middle" >same direction, own way</text>
