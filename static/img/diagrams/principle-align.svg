<text x="600.0" y="621" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >Shared direction, local choice.</text>
<text x="600.0" y="647" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >The centre proposes, value streams can object, the centre answers and decides.</text>
