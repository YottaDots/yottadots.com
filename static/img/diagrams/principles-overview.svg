<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The four YottaDots principles and how they work together</title>
<desc id="d">A centre at the top and four value streams below it. Federate is the split between them: the centre decides the what, the value streams decide the how. Align is the two-way arrows between them: goals go down, input and objections come up. Augment is a band of AI co-workers across the whole organization, reducing coordination work, with a human owner for every result. Evolve is a loop around everything: the design is tried, reviewed and changed.</desc>
