<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">SAFe in one page</title>
<desc id="d">Visual summary of SAFe. Core idea: Scaling agile across a portfolio: central portfolio management, release trains for delivery. The what is decided by: Lean Portfolio Management: strategic themes, portfolio vision, value stream budgets. The how is decided by: Release trains and teams, within prescribed roles and events such as PI Planning. Strong at: Very detailed guidance and training; Participatory budgeting by value stream. Watch out for: Critics see it as heavy and hierarchical; Fixed structures can outlive their use. Relation to YottaDots: COMBINE + LEARN: Combine at value stream level; learn from participatory budgeting.</desc>
