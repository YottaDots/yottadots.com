<text x="1069" y="437" font-size="13" fill="#e2e2e2" font-weight="500" text-anchor="middle" >stream</text>
<text x="900" y="334" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#3a2a1a" stroke-width="6">goals down · “what it takes” up</text>
<text x="670" y="484" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >✓  One clear job for the centre</text>
<text x="670" y="508" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >✓  Value streams can object</text>
<text x="670" y="532" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >✓  Value streams decide the how</text>
