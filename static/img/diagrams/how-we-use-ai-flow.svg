<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">How a change is made: AI drafts, humans decide</title>
<desc id="d">Two lanes, human and AI co-worker, in five steps. 1. The human asks what needs explaining. 2. AI drafts text, code or a visual. 3. AI checks sources, the rendered image and gaps; the human judges whether it is correct and clear. 4. AI changes it based on feedback. 5. AI proposes the change as a pull request; the human approves and merges it, and only then does it go live.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b9b9b"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="469" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">HOW A CHANGE IS MADE</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >AI drafts. Humans decide.</text>
<rect x="40" y="140" width="1120" height="100" rx="12" fill="#18191b" stroke="#303236" stroke-width="2" />
<text x="64" y="196" font-size="18" fill="#f28c28" font-weight="700" text-anchor="start" >Human</text>
<rect x="40" y="270" width="1120" height="100" rx="12" fill="#18191b" stroke="#303236" stroke-width="2" />
<text x="64" y="326" font-size="18" fill="#e2e2e2" font-weight="700" text-anchor="start" >AI co-worker</text>
<rect x="196" y="154" width="172" height="72" rx="10" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="210" y="184" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >1. Ask</text>
<text x="210" y="208" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >What to explain?</text>
<rect x="392" y="284" width="172" height="72" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="406" y="314" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >2. Draft</text>
<text x="406" y="338" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >Text, code or visual</text>
<rect x="588" y="284" width="172" height="72" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="602" y="314" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >3. Check</text>
<text x="602" y="338" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >Sources, image, gaps</text>
<rect x="588" y="154" width="172" height="72" rx="10" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="602" y="184" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >3. Judge</text>
<text x="602" y="208" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >Correct? Clear?</text>
<rect x="784" y="284" width="172" height="72" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="798" y="314" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >4. Change</text>
<text x="798" y="338" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >Based on feedback</text>
<rect x="980" y="284" width="172" height="72" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="994" y="314" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >5. Propose</text>
<text x="994" y="338" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >Opens a pull request</text>
<rect x="980" y="154" width="172" height="72" rx="10" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="994" y="184" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >5. Approve</text>
<text x="994" y="208" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="start" >Merges: goes live</text>
<path d="M319.84,226 L319.84,253.0 L440.16,253.0 L440.16,280" fill="none" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="566" y1="320.0" x2="584" y2="320.0" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="656.8" y1="284" x2="656.8" y2="230" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M711.84,226 L711.84,253.0 L832.16,253.0 L832.16,280" fill="none" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="958" y1="320.0" x2="976" y2="320.0" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1048.8" y1="284" x2="1048.8" y2="230" stroke="#f28c28" stroke-width="2" marker-end="url(#arrO)"/>
<circle cx="52" cy="432" r="6" fill="#f28c28"/>
<text x="68" y="438" font-size="16" fill="#e2e2e2" font-weight="500" text-anchor="start" >Nothing goes live without human approval. Every AI contribution is visible in the history.</text>
</svg>
