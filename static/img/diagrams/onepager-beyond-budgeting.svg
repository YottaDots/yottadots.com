<text x="40" y="98" font-size="34" fill="#ffffff" font-weight="800" text-anchor="start" >Beyond Budgeting</text>
<text x="40" y="136" font-size="20" fill="#e2e2e2" font-weight="500" text-anchor="start" >Steer without a fixed annual budget: purpose, relative goals, resources as needed.</text>
