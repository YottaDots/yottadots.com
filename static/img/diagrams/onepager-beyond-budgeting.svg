<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">One-pager: Beyond Budgeting</title>
<desc id="d">Visual summary of Beyond Budgeting. Core idea: steer without a fixed annual budget, through purpose, relative goals and resources made available as needed. The what: leadership sets purpose and directional, ambitious, relative goals, avoiding fixed and cascaded targets. The how: teams, within shared values and sound judgement rather than detailed rules. Strong at: separating targets, forecasts and resource allocation, and long cases such as Handelsbanken and Equinor. Watch out for: few organizations adopt it in full, and the evidence is mostly case studies. Relation to YottaDots: combine, because Beyond Budgeting covers money and targets while YottaDots covers who decides what.</desc>
