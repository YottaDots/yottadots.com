<text x="66" y="425" font-size="13" fill="#f28c28" font-weight="600" text-anchor="start" >guardrails</text>
<circle cx="48" cy="300" r="17" fill="#f28c28"/>
<text x="48" y="306" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >4</text>
