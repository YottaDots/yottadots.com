<text x="894" y="188" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start" >Name what is central</text>
<text x="894" y="214" font-size="13" fill="#9b9b9b" font-weight="500" text-anchor="start" >rule 3: the rest stays with value streams</text>
<circle cx="866" cy="282" r="17" fill="#f28c28"/>
<text x="866" y="288" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >2</text>
<text x="894" y="288" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start" >Objection round on goals</text>
<text x="894" y="314" font-size="13" fill="#9b9b9b" font-weight="500" text-anchor="start" >rule 2: value streams help shape the what</text>
<circle cx="866" cy="382" r="17" fill="#f28c28"/>
<text x="866" y="388" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >3</text>
<text x="894" y="388" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start" >Opt-out of shared services</text>
<text x="894" y="414" font-size="13" fill="#9b9b9b" font-weight="500" text-anchor="start" >rule 4: unless agreed as a guardrail</text>
<circle cx="866" cy="482" r="17" fill="#f28c28"/>
<text x="866" y="488" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >4</text>
<text x="894" y="488" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start" >Guardrails that earn their place</text>
<text x="894" y="514" font-size="13" fill="#9b9b9b" font-weight="500" text-anchor="start" >few rules, each one justified</text>
<circle cx="866" cy="582" r="17" fill="#f28c28"/>
