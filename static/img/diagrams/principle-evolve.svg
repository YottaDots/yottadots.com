<text x="64" y="216" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Treat every choice</text>
<text x="64" y="238" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >as a hypothesis.</text>
<rect x="322" y="130" width="254" height="250" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<circle cx="356" cy="166" r="17" fill="#f28c28"/>
<text x="356" y="172" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >2</text>
<text x="384" y="172" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Try</text>
<text x="346" y="216" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >In practice, small</text>
<text x="346" y="238" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >first. Decide what</text>
<text x="346" y="260" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >it replaces.</text>
<rect x="604" y="130" width="254" height="250" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<circle cx="638" cy="166" r="17" fill="#f28c28"/>
<text x="638" y="172" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >3</text>
<text x="666" y="172" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Look</text>
<text x="628" y="216" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >At the signals: what</text>
<text x="628" y="238" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >works, what does not.</text>
<rect x="886" y="130" width="254" height="250" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="2" />
<circle cx="920" cy="166" r="17" fill="#f28c28"/>
<text x="920" y="172" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >4</text>
<text x="948" y="172" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Review</text>
<rect x="908" y="206" width="210" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="1013.0" y="228.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Keep</text>
<rect x="908" y="256" width="210" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="1013.0" y="278.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Change</text>
<rect x="908" y="306" width="210" height="34" rx="17" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="1.5" />
<text x="1013.0" y="328.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle" >Stop</text>
<line x1="296" y1="255.0" x2="318" y2="255.0" stroke="#f28c28" stroke-width="3" marker-end="url(#arrO)"/>
