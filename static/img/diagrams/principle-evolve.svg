<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Principle 4: Evolve</title>
<desc id="d">A loop of four steps. 1. Design: treat every choice as a hypothesis. 2. Try it in practice, small first. 3. Look at the signals: what works and what does not. 4. Review: keep, change or stop. Then back to design. Examples of what goes through the loop: the list of central decisions, the guardrails, the patterns and the way of working of each value stream. Below: every design choice is a hypothesis.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">PRINCIPLE 4</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Evolve</text>
<rect x="40" y="130" width="254" height="250" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<circle cx="74" cy="166" r="17" fill="#f28c28"/>
