<line x1="860" y1="255.0" x2="882" y2="255.0" stroke="#f28c28" stroke-width="3" marker-end="url(#arrO)"/>
<path d="M 1013.0 384 L 1013.0 424 L 167.0 424 L 167.0 388" fill="none" stroke="#f28c28" stroke-width="2.5" marker-end="url(#arrO)" stroke-dasharray="8 6"/>
<text x="600" y="450" font-size="14" fill="#f28c28" font-weight="600" text-anchor="middle" >and again</text>
<text x="40" y="500" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start" >What goes through the loop:</text>
<rect x="40" y="518" width="264" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="172.0" y="540.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >The central list</text>
<rect x="320" y="518" width="264" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="452.0" y="540.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Guardrails</text>
<rect x="600" y="518" width="264" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="732.0" y="540.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Patterns</text>
<rect x="880" y="518" width="264" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="1012.0" y="540.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Each value stream's how</text>
<rect x="40" y="590" width="1120" height="86" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="1.5" />
<text x="600.0" y="621" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >Every design choice is a hypothesis.</text>
<text x="600.0" y="647" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >Small, regular changes instead of big reorganizations.</text>
