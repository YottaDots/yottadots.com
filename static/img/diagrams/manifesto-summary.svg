<title id="t">YottaDots Manifesto: Federated. AI-native. Outcome-driven.</title>
<desc id="d">Three symbols. Left: independent members around a shared core, with arrows from the members to the core. Middle: a learning loop with a rising arrow. Right: a human head in front of an AI head with circuit lines. Text: Members align together, act independently and learn from evidence, with AI as a co-worker and humans accountable for outcomes.</desc>
