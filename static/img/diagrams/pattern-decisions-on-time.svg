<text x="894" y="456" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >open · overdue</text>
<text x="836" y="512" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="start" >+ ask: which decision are</text>
<text x="836" y="532" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="start" >you waiting for most?</text>
<rect x="40" y="586" width="1120" height="86" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="1.5" />
<text x="600.0" y="617" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >A decision that waits has a cost. Make the wait visible.</text>
<text x="600.0" y="643" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >One owner per decision · a visible date · postpone only in the open</text>
