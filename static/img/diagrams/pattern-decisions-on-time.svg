<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Pattern 11: Decisions on time</title>
<desc id="d">On the left, a decision board visible to everyone, with four columns: open, due soon, overdue and decided. Each card shows the decision, its owner and its decide-by date; decided cards also show the reason. On the right, a decision health check with three measures: decision lead time from question to decision, the share of decisions made by their date, and the number of open and overdue decisions. Below: a decision that waits has a cost; make the wait visible.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
