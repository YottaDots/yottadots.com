<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">ONE-PAGER</text>
<text x="40" y="98" font-size="34" fill="#ffffff" font-weight="800" text-anchor="start" >Holacracy</text>
<text x="40" y="136" font-size="20" fill="#e2e2e2" font-weight="500" text-anchor="start" >Authority in a written constitution: roles and circles instead of managers.</text>
<rect x="40" y="200" width="550" height="150" rx="14" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2"/>
<text x="64" y="236" font-size="14" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="1">THE WHAT is decided by</text>
<text x="64" y="270" font-size="19" fill="#ffffff" font-weight="600" text-anchor="start" >The broader circle gives each circle its</text>
<text x="64" y="298" font-size="19" fill="#ffffff" font-weight="600" text-anchor="start" >purpose; the circle lead sets priorities</text>
<rect x="610" y="200" width="550" height="150" rx="14" fill="#18191b" stroke="#f28c28" stroke-width="2"/>
<text x="634" y="236" font-size="14" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="1">THE HOW is decided by</text>
<text x="634" y="270" font-size="19" fill="#ffffff" font-weight="600" text-anchor="start" >Role leads may take any action that serves</text>
<text x="634" y="298" font-size="19" fill="#ffffff" font-weight="600" text-anchor="start" >their role, unless a rule limits it</text>
<rect x="40" y="376" width="550" height="140" rx="14" fill="#18191b" stroke="#303236" stroke-width="2"/>
<text x="64" y="412" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Strong at</text>
<circle cx="70" cy="440" r="5" fill="#f28c28"/>
<text x="86" y="446" font-size="16" fill="#e2e2e2" font-weight="400" text-anchor="start" >Formal objections in governance</text>
