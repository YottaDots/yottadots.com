<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Holacracy in one page</title>
<desc id="d">Visual summary of Holacracy. Core idea: Authority in a written constitution: roles and circles instead of managers. The what is decided by: The broader circle gives each circle its purpose; the circle lead sets priorities. The how is decided by: Role leads may take any action that serves their role, unless a rule limits it. Strong at: Formal objections in governance; Default authority with the role (like rule 3). Watch out for: Complex: Medium dropped it in 2016; Zappos: about 18% left after the ultimatum. Relation to YottaDots: LEARN: Closest relative. But YottaDots keeps managers and prescribes no constitution.</desc>
