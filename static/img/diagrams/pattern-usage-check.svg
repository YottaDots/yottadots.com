<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Pattern 7: Usage check: stop what is not used</title>
<desc id="d">Delivered work, such as applications, features and reports, goes through a usage check at a set moment. Three outcomes: used, so keep it; little used, so improve it or ask why; not used, so stop it and remove it. Removing is planned work with an owner. Below: what is not used still costs money until it is removed.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">PATTERN 7</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Usage check: stop what is not used</text>
<rect x="40" y="150" width="300" height="330" rx="14" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="70" y="192" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start" >Delivered work</text>
<rect x="70" y="218" width="240" height="40" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="190.0" y="243.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Applications</text>
<rect x="70" y="274" width="240" height="40" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="190.0" y="299.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Features</text>
<rect x="70" y="330" width="240" height="40" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="190.0" y="355.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Reports</text>
<rect x="70" y="386" width="240" height="40" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="190.0" y="411.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Dashboards</text>
<line x1="344" y1="315" x2="410" y2="315" stroke="#f28c28" stroke-width="3" marker-end="url(#arrO)"/>
<rect x="414" y="230" width="200" height="170" rx="14" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="514" y="296" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle" >Usage</text>
<text x="514" y="322" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle" >check</text>
<text x="514" y="354" font-size="13" fill="#9b9b9b" font-weight="500" text-anchor="middle" >after 3–6 months,</text>
<text x="514" y="372" font-size="13" fill="#9b9b9b" font-weight="500" text-anchor="middle" >then yearly</text>
<path d="M 618 315 L 660 315 L 660 198 L 690 198" fill="none" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="696" y="150" width="464" height="96" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="724" y="190" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start" >Used</text>
<text x="724" y="220" font-size="16" fill="#e2e2e2" font-weight="500" text-anchor="start" >Keep it</text>
<path d="M 618 315 L 660 315 L 660 314 L 690 314" fill="none" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="696" y="266" width="464" height="96" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="724" y="306" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start" >Little used</text>
<text x="724" y="336" font-size="16" fill="#e2e2e2" font-weight="500" text-anchor="start" >Improve it, or ask why</text>
<path d="M 618 315 L 660 315 L 660 430 L 690 430" fill="none" stroke="#f28c28" stroke-width="2.5" marker-end="url(#arrO)"/>
<rect x="696" y="382" width="464" height="96" rx="12" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="724" y="422" font-size="19" fill="#f28c28" font-weight="700" text-anchor="start" >Not used</text>
<text x="724" y="452" font-size="16" fill="#e2e2e2" font-weight="500" text-anchor="start" >Stop it and remove it</text>
<text x="1136" y="502" font-size="14" fill="#9b9b9b" font-weight="500" text-anchor="end" >Removing is planned work, with an owner and a date.</text>
<rect x="40" y="580" width="1120" height="86" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="1.5" />
<text x="600.0" y="611" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >What is not used still costs money until it is removed.</text>
<text x="600.0" y="637" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >Maintenance, security, support and licences, every year.</text>
</svg>
