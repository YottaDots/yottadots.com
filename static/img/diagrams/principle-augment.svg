<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Augment</text>
<rect x="40" y="130" width="540" height="420" rx="14" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="70" y="172" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start" >Before: coordination by layers</text>
<text x="70" y="198" font-size="14" fill="#9b9b9b" font-weight="500" text-anchor="start" >reports up, decisions down, hand-offs between</text>
<line x1="310" y1="268" x2="210" y2="322" stroke="#c9c9c9" stroke-width="2"/>
<line x1="310" y1="268" x2="410" y2="322" stroke="#c9c9c9" stroke-width="2"/>
<line x1="210" y1="358" x2="160" y2="422" stroke="#c9c9c9" stroke-width="2"/>
<line x1="210" y1="358" x2="260" y2="422" stroke="#c9c9c9" stroke-width="2"/>
<line x1="410" y1="358" x2="360" y2="422" stroke="#c9c9c9" stroke-width="2"/>
<line x1="410" y1="358" x2="460" y2="422" stroke="#c9c9c9" stroke-width="2"/>
<circle cx="310" cy="250" r="18" fill="#3a3c40"/>
<circle cx="210" cy="340" r="18" fill="#3a3c40"/>
<circle cx="410" cy="340" r="18" fill="#3a3c40"/>
<circle cx="160" cy="440" r="18" fill="#3a3c40"/>
<circle cx="260" cy="440" r="18" fill="#3a3c40"/>
<circle cx="360" cy="440" r="18" fill="#3a3c40"/>
<circle cx="460" cy="440" r="18" fill="#3a3c40"/>
<text x="310" y="512" font-size="14" fill="#9b9b9b" font-weight="500" text-anchor="middle" >report · status meeting · hand-off · check</text>
<rect x="620" y="130" width="540" height="420" rx="14" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="650" y="172" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start" >After: AI takes on coordination work</text>
<text x="650" y="198" font-size="14" fill="#9b9b9b" font-weight="500" text-anchor="start" >people spend their time on judgment</text>
<rect x="650" y="228" width="480" height="104" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" stroke-dasharray="3 5"/>
<text x="674" y="258" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start" >AI co-workers</text>
<rect x="674" y="278" width="100" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
<text x="724.0" y="300.0" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Route</text>
<rect x="786" y="278" width="100" height="34" rx="17" fill="#18191b" stroke="#3a3c40" stroke-width="1.5" />
