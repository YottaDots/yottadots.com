<circle cx="830" cy="422" r="20" fill="#f28c28"/>
<line x1="950" y1="336" x2="950" y2="398" stroke="#f28c28" stroke-width="2.5" marker-end="url(#arrO)"/>
<circle cx="950" cy="422" r="20" fill="#f28c28"/>
<line x1="1070" y1="336" x2="1070" y2="398" stroke="#f28c28" stroke-width="2.5" marker-end="url(#arrO)"/>
<circle cx="1070" cy="422" r="20" fill="#f28c28"/>
<text x="890" y="474" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" >People decide, and are accountable</text>
<text x="890" y="500" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="middle" >a named human owns every result</text>
<rect x="40" y="590" width="1120" height="86" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="1.5" />
<text x="600.0" y="621" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >AI takes on what needs no human judgment.</text>
<text x="600.0" y="647" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >Fewer layers needed to coordinate, more room for the value streams.</text>
</svg>
