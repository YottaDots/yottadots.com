<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Visual summary: the YottaDots federation</title>
<desc id="d">Five independent members surround a shared core. Each member has its own teams. Arrows run from the members to the core: members delegate powers to the core. A dashed arrow back shows that a member can take a delegated power back. Next to it, three lines: 1. Keep: members keep what they can do best themselves. 2. Delegate: together they delegate what must be shared, and can take it back. 3. Automate: AI takes on what needs no human judgment. Note: everything that is not delegated stays with the members.</desc>
