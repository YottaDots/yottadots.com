<text x="700" y="251" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >1</text>
<text x="734" y="251" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start" >Keep</text>
<text x="734" y="281" font-size="16" fill="#e2e2e2" font-weight="400" text-anchor="start" >Members keep what they can do best</text>
