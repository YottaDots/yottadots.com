<text x="734" y="409" font-size="16" fill="#e2e2e2" font-weight="400" text-anchor="start" >Together they delegate what must be</text>
<text x="734" y="431" font-size="16" fill="#e2e2e2" font-weight="400" text-anchor="start" >shared, and can take it back.</text>
<rect x="660" y="461" width="500" height="112" rx="12" fill="#18191b" stroke="#303236" stroke-width="2"/>
