<text x="656" y="446" font-size="16" fill="#e2e2e2" font-weight="400" text-anchor="start" >Can become a top-down cascade or checklist</text>
<circle cx="640" cy="472" r="5" fill="#9b9b9b"/>
<text x="656" y="478" font-size="16" fill="#e2e2e2" font-weight="400" text-anchor="start" >Cagan stopped recommending it for most companies</text>
