<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">OKRs in one page</title>
<desc id="d">Visual summary of OKRs. Core idea: Goals as objectives with measurable key results, set top-down and bottom-up. The what is decided by: Leadership, which sets the company objectives. The how is decided by: The teams, who often write a large share of their own OKRs. Strong at: Simple and widely known; A long track record. Watch out for: Can become a top-down cascade or checklist; Cagan stopped recommending it for most companies. Relation to YottaDots: COMBINE: OKRs can express the centre's what in YottaDots.</desc>
