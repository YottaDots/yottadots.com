<circle cx="304.0" cy="478" r="5" fill="#f28c28"/>
<text x="318.0" y="484" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >What can AI do on its own?</text>
<rect x="582.4" y="458" width="329.2" height="40" rx="20" fill="#202124" stroke="#303236" stroke-width="2" />
<circle cx="600.4" cy="478" r="5" fill="#f28c28"/>
<text x="614.4" y="484" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Where must human judgment remain?</text>
<rect x="40" y="514" width="228.4" height="40" rx="20" fill="#202124" stroke="#303236" stroke-width="2" />
<circle cx="58" cy="534" r="5" fill="#f28c28"/>
<text x="72" y="540" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Who owns the outcome?</text>
<rect x="294.4" y="514" width="278.8" height="40" rx="20" fill="#202124" stroke="#303236" stroke-width="2" />
<circle cx="312.4" cy="534" r="5" fill="#f28c28"/>
<text x="326.4" y="540" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >What guardrails are needed?</text>
</svg>
