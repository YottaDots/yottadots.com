<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" width="1200" height="578" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Visual summary: AI as a co-worker</title>
<desc id="d">Left: adding AI to an existing five-step process keeps the same steps and hand-offs, with AI attached to each step. Right: redesigning the work, where a human and AI together handle the work and steps two to four are no longer needed. Below: the questions to answer for every piece of work: what can AI support, what can AI do on its own, where must human judgment remain, who owns the outcome, and what guardrails are needed.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b9b9b"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="577" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">VISUAL SUMMARY</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Don’t just add AI to the process. Redesign the work.</text>
<rect x="40" y="130" width="540" height="270" rx="14" fill="#18191b" stroke="#303236" stroke-width="2" />
<text x="64" y="170" font-size="20" fill="#e2e2e2" font-weight="600" text-anchor="start" >Adding AI to existing processes</text>
<rect x="64" y="220" width="76" height="56" rx="8" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="102.0" y="254" font-size="15" fill="#9b9b9b" font-weight="500" text-anchor="middle" >Step 1</text>
<circle cx="102.0" cy="302" r="11" fill="#f28c28"/>
<line x1="102.0" y1="276" x2="102.0" y2="291" stroke="#f28c28" stroke-width="2"/>
<text x="102.0" y="306" font-size="10" fill="#18191b" font-weight="700" text-anchor="middle" >AI</text>
<line x1="142" y1="248" x2="160" y2="248" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="163" y="220" width="76" height="56" rx="8" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="201.0" y="254" font-size="15" fill="#9b9b9b" font-weight="500" text-anchor="middle" >Step 2</text>
<circle cx="201.0" cy="302" r="11" fill="#f28c28"/>
<line x1="201.0" y1="276" x2="201.0" y2="291" stroke="#f28c28" stroke-width="2"/>
<text x="201.0" y="306" font-size="10" fill="#18191b" font-weight="700" text-anchor="middle" >AI</text>
<line x1="241" y1="248" x2="259" y2="248" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="262" y="220" width="76" height="56" rx="8" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="300.0" y="254" font-size="15" fill="#9b9b9b" font-weight="500" text-anchor="middle" >Step 3</text>
<circle cx="300.0" cy="302" r="11" fill="#f28c28"/>
<line x1="300.0" y1="276" x2="300.0" y2="291" stroke="#f28c28" stroke-width="2"/>
<text x="300.0" y="306" font-size="10" fill="#18191b" font-weight="700" text-anchor="middle" >AI</text>
<line x1="340" y1="248" x2="358" y2="248" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="361" y="220" width="76" height="56" rx="8" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="399.0" y="254" font-size="15" fill="#9b9b9b" font-weight="500" text-anchor="middle" >Step 4</text>
<circle cx="399.0" cy="302" r="11" fill="#f28c28"/>
<line x1="399.0" y1="276" x2="399.0" y2="291" stroke="#f28c28" stroke-width="2"/>
<text x="399.0" y="306" font-size="10" fill="#18191b" font-weight="700" text-anchor="middle" >AI</text>
<line x1="439" y1="248" x2="457" y2="248" stroke="#9b9b9b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="460" y="220" width="76" height="56" rx="8" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="498.0" y="254" font-size="15" fill="#9b9b9b" font-weight="500" text-anchor="middle" >Step 5</text>
<circle cx="498.0" cy="302" r="11" fill="#f28c28"/>
<line x1="498.0" y1="276" x2="498.0" y2="291" stroke="#f28c28" stroke-width="2"/>
<text x="498.0" y="306" font-size="10" fill="#18191b" font-weight="700" text-anchor="middle" >AI</text>
<text x="64" y="362" font-size="17" fill="#9b9b9b" font-weight="400" text-anchor="start" >Same steps, same hand-offs, plus a tool.</text>
<rect x="620" y="130" width="540" height="270" rx="14" fill="#18191b" stroke="#f28c28" stroke-width="2" />
<text x="644" y="170" font-size="20" fill="#f28c28" font-weight="700" text-anchor="start" >Redesigning the work</text>
<rect x="644" y="220" width="150" height="56" rx="8" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="719" y="254" font-size="15" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Human + AI</text>
<rect x="834" y="220" width="110" height="56" rx="8" fill="none" stroke="#3a3c40" stroke-width="2" stroke-dasharray="6 6"/>
<text x="889" y="254" font-size="15" fill="#9b9b9b" font-weight="500" text-anchor="middle" text-decoration="line-through">Step 2–4</text>
<rect x="984" y="220" width="150" height="56" rx="8" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="1059" y="254" font-size="15" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Human + AI</text>
<path d="M794,248 C854,190 924,190 982,240" fill="none" stroke="#f28c28" stroke-width="2" marker-end="url(#arrO)"/>
<text x="889" y="306" font-size="14" fill="#9b9b9b" font-weight="400" text-anchor="middle" >no longer needed</text>
<text x="644" y="362" font-size="17" fill="#e2e2e2" font-weight="400" text-anchor="start" >Sometimes the process itself should disappear.</text>
<text x="40" y="436" font-size="17" fill="#9b9b9b" font-weight="600" text-anchor="start" >Questions to answer for every piece of work</text>
<rect x="40" y="458" width="220.0" height="40" rx="20" fill="#202124" stroke="#303236" stroke-width="2" />
<circle cx="58" cy="478" r="5" fill="#f28c28"/>
