<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Pattern 8: Budgets that do not punish saving</title>
<desc id="d">Left, the use-it-or-lose-it cycle: the budget expires at year end, so it is spent in a rush; unspent money means a smaller budget next year, so spending replaces choices. Right, the YottaDots alternative: part of unspent budget carries over, value streams are judged on outcomes rather than spending, and funding follows priorities, reviewed regularly. Below: saving should never be the expensive choice.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">PATTERN 8</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Budgets that do not punish saving</text>
<rect x="40" y="130" width="540" height="420" rx="14" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<text x="70" y="172" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start" >Use it or lose it</text>
<rect x="200" y="214" width="220" height="52" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="310" y="246" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Budget expires at year end</text>
<rect x="350" y="334" width="220" height="52" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="460" y="366" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Rush to spend</text>
<rect x="200" y="454" width="220" height="52" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="310" y="486" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Saving = smaller budget</text>
<rect x="50" y="334" width="220" height="52" rx="10" fill="#202124" stroke="#3a3c40" stroke-width="2" />
<text x="160" y="366" font-size="14" fill="#e2e2e2" font-weight="600" text-anchor="middle" >Spending, not choosing</text>
<line x1="390" y1="270" x2="440" y2="330" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="440" y1="390" x2="390" y2="452" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="230" y1="452" x2="180" y2="390" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="180" y1="330" x2="230" y2="270" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="620" y="130" width="540" height="420" rx="14" fill="rgba(242,140,40,0.14)" stroke="#f28c28" stroke-width="2" />
<text x="650" y="172" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start" >Budgets that do not punish saving</text>
<rect x="650" y="200" width="480" height="70" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="674" y="230" font-size="17" fill="#f28c28" font-weight="700" text-anchor="start" >Carry over</text>
<text x="674" y="254" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >part of unspent budget, up to a limit</text>
<rect x="650" y="284" width="480" height="70" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="674" y="314" font-size="17" fill="#f28c28" font-weight="700" text-anchor="start" >Judge outcomes</text>
<text x="674" y="338" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >not whether the budget was used up</text>
<rect x="650" y="368" width="480" height="70" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="674" y="398" font-size="17" fill="#f28c28" font-weight="700" text-anchor="start" >Fund priorities</text>
<text x="674" y="422" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >reviewed every quarter, not once a year</text>
<rect x="650" y="452" width="480" height="70" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="674" y="482" font-size="17" fill="#f28c28" font-weight="700" text-anchor="start" >Overspending visible</text>
<text x="674" y="506" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >discussed in the same review</text>
<rect x="40" y="590" width="1120" height="86" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="1.5" />
<text x="600.0" y="621" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >Saving should never be the expensive choice.</text>
<text x="600.0" y="647" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >Where laws set the budget rules, use the room that exists and make the cost visible.</text>
</svg>
