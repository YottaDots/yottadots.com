<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 822" width="1200" height="822" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Visual summary: SAFe, Product Operating Model, OKRs, Holacracy and YottaDots compared</title>
<desc id="d">A table comparing SAFe, the Product Operating Model, OKRs, Holacracy and YottaDots on eight points. 1. The centre decides the what: yes for all five. 2. Units help shape the goals: partly for the first four, yes for YottaDots. As a formal right (for YottaDots: to object, propose and experiment): not described for SAFe, the Product Operating Model and OKRs; partly for Holacracy (governance only); yes for YottaDots. 3. What is not named stays with the units: not described for SAFe, the Product Operating Model and OKRs; yes for Holacracy and YottaDots. 4. Units may opt out of shared services: only YottaDots; not in scope for OKRs. Units choose their own delivery method: yes for OKRs and YottaDots, partly for the others. Detailed practical guidance: yes for SAFe, the Product Operating Model and Holacracy; partly for OKRs and YottaDots. Track record: yes for SAFe and OKRs, partly for the Product Operating Model and Holacracy, none yet for YottaDots. Ratings by YottaDots, based on public sources.</desc>
