<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Pattern 9: Proposal route</title>
<desc id="d">Four steps from left to right. 1. A value stream writes a one-page proposal: what, why, expected effect, and what it would replace or stop. 2. Proposals are collected for the next planning round. 3. The centre answers every proposal in writing within one planning cycle or 30 days, whichever is shorter: accept, amend, or decline with reasons. 4. Proposals and answers are published for all value streams. Below: ideas no longer need the boss's approval to be heard; the centre still decides.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c28"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#202124" stroke="#303236"/>
<text x="40" y="58" font-size="15" fill="#f28c28" font-weight="700" text-anchor="start" letter-spacing="2">PATTERN 9</text>
<text x="40" y="92" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Proposal route</text>
<rect x="40" y="140" width="254" height="380" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<circle cx="74" cy="176" r="17" fill="#f28c28"/>
<text x="74" y="182" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >1</text>
<text x="102" y="182" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >One-page proposal</text>
<text x="64" y="226" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >What, and why.</text>
<text x="64" y="248" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Expected effect.</text>
<text x="64" y="270" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >What it would</text>
<text x="64" y="292" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >replace or stop.</text>
<text x="64" y="314" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" ></text>
<text x="64" y="336" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Results of an</text>
<text x="64" y="358" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >experiment, if any.</text>
<rect x="322" y="140" width="254" height="380" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<circle cx="356" cy="176" r="17" fill="#f28c28"/>
<text x="356" y="182" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >2</text>
<text x="384" y="182" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Planning round</text>
<text x="346" y="226" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Proposals are</text>
<text x="346" y="248" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >collected for the</text>
<text x="346" y="270" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >next goal-setting</text>
<text x="346" y="292" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >round. Urgent ones</text>
<text x="346" y="314" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >can go earlier.</text>
<rect x="604" y="140" width="254" height="380" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="2" />
<circle cx="638" cy="176" r="17" fill="#f28c28"/>
<text x="638" y="182" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >3</text>
<text x="666" y="182" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Centre answers</text>
<text x="628" y="226" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >In writing, within</text>
<text x="628" y="248" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >one cycle or 30 days:</text>
<rect x="626" y="262" width="210" height="62" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="644" y="289" font-size="16" fill="#f28c28" font-weight="700" text-anchor="start" >Accept</text>
<text x="644" y="311" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >becomes a goal</text>
<rect x="626" y="340" width="210" height="62" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="644" y="367" font-size="16" fill="#f28c28" font-weight="700" text-anchor="start" >Amend</text>
<text x="644" y="389" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >changed, then accepted</text>
<rect x="626" y="418" width="210" height="62" rx="10" fill="#18191b" stroke="#f28c28" stroke-width="1.5" />
<text x="644" y="445" font-size="16" fill="#f28c28" font-weight="700" text-anchor="start" >Decline</text>
<text x="644" y="467" font-size="14" fill="#e2e2e2" font-weight="500" text-anchor="start" >with the reasons</text>
<rect x="886" y="140" width="254" height="380" rx="12" fill="#18191b" stroke="#3a3c40" stroke-width="2" />
<circle cx="920" cy="176" r="17" fill="#f28c28"/>
<text x="920" y="182" font-size="17" fill="#18191b" font-weight="800" text-anchor="middle" >4</text>
<text x="948" y="182" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start" >Published</text>
<text x="910" y="226" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >Proposals and</text>
<text x="910" y="248" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >answers are visible</text>
<text x="910" y="270" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >to all value streams,</text>
<text x="910" y="292" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >in the same log as</text>
<text x="910" y="314" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="start" >the objections.</text>
<line x1="296" y1="330.0" x2="336" y2="330.0" stroke="#f28c28" stroke-width="3" marker-end="url(#arrO)"/>
<line x1="578" y1="330.0" x2="618" y2="330.0" stroke="#f28c28" stroke-width="3" marker-end="url(#arrO)"/>
<line x1="860" y1="330.0" x2="900" y2="330.0" stroke="#f28c28" stroke-width="3" marker-end="url(#arrO)"/>
<rect x="40" y="566" width="1120" height="86" rx="12" fill="rgba(242,140,40,0.10)" stroke="#f28c28" stroke-width="1.5" />
<text x="600.0" y="597" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" >Ideas no longer need the boss's approval to be heard.</text>
<text x="600.0" y="623" font-size="15" fill="#e2e2e2" font-weight="500" text-anchor="middle" >The centre still decides, but every proposal gets an answer that everyone can read.</text>
</svg>
