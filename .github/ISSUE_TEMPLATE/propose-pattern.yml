name: Propose a pattern

description: Propose a new YottaDots organizational pattern.

title: "[Pattern]: "

labels:
  - pattern-proposal

body:

  - type: input
    id: name
    attributes:
      label: Pattern name
      placeholder: Give the pattern a short name
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where does this situation occur?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring organizational problem does this address?
    validations:
      required: true

  - type: textarea
    id: pattern
    attributes:
      label: Proposed pattern
      description: What approach appears to work?
    validations:
      required: true

  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails
      description: What boundaries or conditions are important?

  - type: textarea
    id: evidence
    attributes:
      label: Experience or evidence
      description: Where have you seen this work?

  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use AI for this contribution?
      description: Using AI is fine. You remain responsible for what you submit.
      options:
        - "No"
        - "Yes, for a first draft that I edited"
        - "Yes, for research or checking"
        - "Yes, mostly written by AI"
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am happy for this contribution to be reviewed and developed by the YottaDots community.
          required: true
        - label: I agree that my contribution is licensed under CC BY 4.0 and that it is my own work or I have the right to share it ([contribution terms](https://github.com/YottaDots/yottadots.com/blob/main/CONTRIBUTING.md#license-of-your-contribution)).
          required: true
